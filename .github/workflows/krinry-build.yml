name: krinry Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [release, debug]
      abi:
        description: 'ABI (arm64 = fastest)'
        required: true
        default: 'arm64'
        type: choice
        options: [arm64, all]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Create android folder
        run: flutter create --platforms android --org com.alaa --project-name hosting .

      - name: Set app label + permissions
        run: |
          python3 - << 'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = re.sub(r'android:label="[^"]*"', 'android:label="HOST PANEL"', s, count=1)
          perms = '''    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
          '''
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', perms + '    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          if 'requestLegacyExternalStorage' not in s:
              s = s.replace('<application', '<application android:requestLegacyExternalStorage="true"', 1)
          p.write_text(s)
          print('OK manifest')
          PY

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      # تعطيل فحص الحماية/التوقيع داخل التطبيق نفسه (وإلا سيقفل التطبيق على نفسه)
      - name: Disable in-app security checks
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path('lib/security_service.dart')
          s = p.read_text()
          old = 'static Future<SecurityResult> verify() async {'
          if old in s and 'return SecurityResult.ok(); // BYPASS' not in s:
              s = s.replace(old, old + '\n    return SecurityResult.ok(); // BYPASS', 1)
              p.write_text(s)
          print('OK security disabled')
          PY

      # بدون keystore وبدون apksigner وبدون verify
      # فلاتر يوقّع تلقائياً بمفتاح debug الافتراضي والـ APK يتثبّت عادي
      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.abi }}" = "arm64" ]; then
            flutter build apk --${{ github.event.inputs.build_type }} --target-platform android-arm64
          else
            flutter build apk --${{ github.event.inputs.build_type }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
